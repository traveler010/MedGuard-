<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediQX — Safer Medications. Smarter Decisions.</title>
  <meta
    name="description"
    content="MediQX is an AI-powered clinical decision support system designed to detect polypharmacy risks, drug-drug collisions, and prescribing cascades for healthcare professionals."
  />
  <link rel="icon" href="/favicon.ico" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #042f2e;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 580px;
      padding: 2.5rem;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(20, 184, 166, 0.3);
      border-radius: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #2dd4bf;
      background: rgba(20, 184, 166, 0.15);
      border: 1px solid rgba(20, 184, 166, 0.3);
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #042f2e;
      background: #14b8a6;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background: #2dd4bf;
    }
  </style>
</head>
<body>
  <!-- Root element -->
  <div id="root">
    <div class="container">
      <div class="badge">Next.js App Router Architecture</div>
      <h1>MediQX — Safer Medications. Smarter Decisions.</h1>
      <p>
        MediQX is powered by <strong>Next.js App Router</strong> with server-rendered React components.
        The interactive clinical dashboard and landing page are served at <code>http://localhost:3000</code>.
      </p>
      <a href="http://localhost:3000" class="btn">Launch MediQX Web App</a>
    </div>
  </div>
</body>
</html>
